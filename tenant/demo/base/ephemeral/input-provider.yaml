# Discovers branches in the workload repo; one ephemeral env per branch.
# includeBranch, env and replicas are set per environment overlay.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: workload-branches
  namespace: demo-ephemeral
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1m"
spec:
  type: GitHubBranch
  url: https://github.com/NotAwar/gitops-demo-eph-env-workload
  # Created out-of-band (see README); avoids GitHub's 60 req/h unauthenticated limit.
  secretRef:
    name: github-auth
  filter:
    includeBranch: "^$"
    limit: 20
  defaultValues:
    tenant: demo
    # Matches the workload's prod namespace; non-prod envs become <app>-<env>[-<branch>].
    app: star-wars
    env: ephemeral
    replicas: 1
    repo: https://github.com/NotAwar/gitops-demo-eph-env-workload.git
