apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: demo-prod-workload
  namespace: flux-system
spec:
  interval: 2m
  url: https://github.com/NotAwar/gitops-demo-eph-env-workload.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-prod-workload
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: demo-prod-workload
  path: ./deploy/prod
  commonMetadata:
    labels:
      tenant: demo
      environment: prod
  postBuild:
    substitute:
      ENV_ID: prod
      ENV_NAMESPACE: star-wars
      GIT_BRANCH: main
