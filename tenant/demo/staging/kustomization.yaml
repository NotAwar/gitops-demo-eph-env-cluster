# One ephemeral environment per staging branch (staging or staging/*).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-staging
resources:
- ../base/ephemeral
labels:
- pairs:
    environment: staging
  includeSelectors: false
patches:
- target:
    kind: ResourceSetInputProvider
    name: workload-branches
  patch: |
    - op: replace
      path: /spec/filter/includeBranch
      value: "^staging(/.+)?$"
    - op: replace
      path: /spec/defaultValues/env
      value: staging
    - op: replace
      path: /spec/defaultValues/replicas
      value: 1
