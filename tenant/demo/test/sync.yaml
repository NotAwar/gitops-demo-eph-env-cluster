apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: workload
  namespace: demo-test
spec:
  interval: 2m
  url: https://github.com/NotAwar/gitops-demo-eph-env-workload.git
  ref:
    branch: test
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workload
  namespace: demo-test
spec:
  serviceAccountName: flux
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: workload
  path: ./deploy/base
  targetNamespace: demo-test
  # Platform-owned test overlay applied on top of the workload base.
  commonMetadata:
    labels:
      environment: test
  patches:
    - target:
        kind: Deployment
      patch: |
        - op: add
          path: /spec/replicas
          value: 1
  postBuild:
    substitute:
      ENV_ID: test
      ENV_NAMESPACE: demo-test
      GIT_BRANCH: test
